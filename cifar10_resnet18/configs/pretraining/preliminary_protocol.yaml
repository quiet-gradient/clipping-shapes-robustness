schema_version: 1
protocol:
  name: preliminary_public_cifar100_screen
  evidence_role: non_evidentiary
  warning: Metrics from this protocol must not be pooled or compared with the final protocol.
experiment: {seed: 42, split_seed: 20260817}
data:
  name: cifar100
  num_classes: 100
  image_size: 32
  train_per_class: 450
  validation_per_class: 50
  normalize_in_transform: false
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  augmentation: {random_crop_size: 32, random_crop_padding: 4, horizontal_flip_probability: 0.5}
model:
  architecture: cifar_resnet18
  initialization: random_tensor_seed_42
  normalization: group_norm
  group_norm_groups: 32
  trainable_scope: full_model
training:
  epochs: 100
  batch_size: 128
  shuffle: true
  drop_last: false
  label_smoothing: 0.0
  precision: fp32
  amp: false
  tf32: false
  optimizer: {name: sgd, momentum: 0.9, weight_decay: 0.0005, nesterov: true}
  scheduler: {name: cosine, eta_min_factor: 0.01}
objective:
  threat_model: linf
  epsilon: 0.03137254901960784
  steps: 10
  step_size: 0.00784313725490196
  random_start: true
  attack_init: uniform
  beta_semantics: kl_multiplier
validation:
  attack: pgd20
  robust_every_epochs: 5
  periodic_restarts: 1
  final_restarts: 5
reproducibility:
  initialization_seed: 42
  dataloader_seed: 42001
  augmentation_seed: 42002
  trades_seed: 42003
  pgd_seed: 42004
