protocol:
  name: public_dev_eps4_v1
  stage: hard_attribution_tuning
  arm: H-A
  status: tuning
  checkpoint_convention: final.pt
  selection_split: val
  selection_rule: balanced_then_robustness
  clean_accuracy_tolerance_pp: 2.0
  test_locked: true
experiment:
  name: ha_b1_c030_lr0100_s42
  seed: 42
  deterministic: true
data:
  name: cifar10
  root: ${oc.env:DATA_ROOT,./data}
  batch_size: 512
  num_workers: 4
  train_ratio: 0.9
  seed: 20260820
  download: true
  augmentation: true
  mean:
  - 0.4914
  - 0.4822
  - 0.4465
  std:
  - 0.2023
  - 0.1994
  - 0.201
model:
  name: resnet18
  num_classes: 10
  pretrained: false
  weights_path: artifacts/public_pretrain/checkpoint_epoch_170.pt
  strict_load: false
  skip_mismatched: true
  reinit_classifier_on_mismatch: true
  source_pretrain:
    protocol: cifar100_trades
    beta: 3
    seed: 42
    epoch: 170
adaptation:
  method: last_block
  train_last_block: true
training:
  device: auto
  allow_cpu_fallback: false
  epochs: 50
  log_every_n_steps: 20
  checkpoint_every_epochs: 1
  physical_batch_size: null
  max_train_batches: null
  max_eval_batches: null
  selected_checkpoint: final.pt
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  scheduler:
    name: cosine
    eta_min_factor: 0.01
diagnostics:
  gradient_probe:
    enabled: false
    source: val
    size: 512
    microbatch_size: 4
    snapshot_fractions:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
    seed: 20260820
    run_at_start: true
    run_at_epoch_end: false
    fail_on_error: true
  private_train_gradients:
    enabled: false
defenses:
- name: dp_sgd
  enabled: true
  epsilon: 4.0
  delta: 1.0e-05
  noise_multiplier: 1.123046875
  max_grad_norm: 0.3
  accountant: rdp
  accountant_crosscheck: prv
  accountant_crosscheck_tolerance_fraction: 0.1
  achieved_epsilon_tolerance: 0.02
  adjacency: add_remove
  secure_mode: false
  poisson_sampling: true
  aggregation_denominator: logical_batch_size
  componentwise_one_release: false
  componentwise_q_r: 0.5
  sensitivity_bound: 0.3
  auto_s: false
  auto_s_gamma: 0.01
  c_task_budget_fraction: 0.8
  c_regularizer_clip_norm: 0.3
  c_joint_epsilon_calibration: true
- name: trades
  enabled: true
  dp_strategy: A
  beta: 1.0
  epsilon: 0.03137254901960784
  step_size: 0.00784313725490196
  steps: 10
  mean:
  - 0.4914
  - 0.4822
  - 0.4465
  std:
  - 0.2023
  - 0.1994
  - 0.201
attacks:
  pgd:
    enabled: true
    epsilon: 0.03137254901960784
    step_size: 0.00784313725490196
    steps: 20
    restarts: 1
    max_batches: null
logging:
  local:
    enabled: true
    dir: outputs
    include_private_train_metrics: false
    include_private_train_gradients: false
